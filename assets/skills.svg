<text x="334.5" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#2DE2E6">Plugins</text>
</g><text class="mono" x="40" y="236" font-size="13" letter-spacing="3" fill="#AEB8E6">TOOLS &amp; PRACTICES</text>
<g class="floatS" style="animation-delay:0.27s">
<rect x="40" y="250" width="64" height="40" rx="20.0" fill="#FF4D8D" fill-opacity=".14" stroke="#FF4D8D" stroke-width="1.6"/>
<text x="72.0" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#FF4D8D">Git</text>
</g>
<g class="floatS" style="animation-delay:0.70s">
<rect x="118" y="250" width="93" height="40" rx="20.0" fill="#FF9F43" fill-opacity=".14" stroke="#FF9F43" stroke-width="1.6"/>
<text x="164.5" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#FF9F43">GitHub</text>
</g>
<g class="floatS" style="animation-delay:1.13s">
