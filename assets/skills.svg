<text x="593.0" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#FF4D8D">TypeScript</text>
</g><text class="mono" x="40" y="144" font-size="13" letter-spacing="3" fill="#AEB8E6">FRAMEWORKS &amp; LIBRARIES</text>
