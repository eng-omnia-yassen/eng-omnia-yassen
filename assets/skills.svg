</g><text class="mono" x="40" y="328" font-size="13" letter-spacing="3" fill="#AEB8E6">CURRENTLY LEARNING</text>
<g class="floatS" style="animation-delay:1.99s"><g class="pulse">
<rect x="40" y="342" width="103" height="40" rx="20.0" fill="url(#gMain)"/>
<text x="91.5" y="368" text-anchor="middle" font-size="16" font-weight="800" fill="#0B1026">Angular</text>
